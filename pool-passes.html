<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pool Passes" />
  <title>Pool Passes</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', sans-serif;
      background: #0a3d5c;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 48px 16px 24px;
      overflow-y: auto;
    }

    h1 {
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 20px;
      font-weight: 400;
    }

    .pass {
      background: #fff;
      border-radius: 14px;
      padding: 14px 16px 10px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pass-name {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 8px;
      align-self: flex-start;
    }

    .pass svg {
      width: 100%;
      max-width: 320px;
      display: block;
    }

    .pass-number {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #aaa;
      margin-top: 4px;
      letter-spacing: 0.12em;
    }
  </style>
</head>
<body>
  <h1>🏊 Camson Pool Passes</h1>
  <div id="passes"></div>

  <script>
    const passes = [
      { name: "Chelsea", barcode: "005444" },
      { name: "Ilana",   barcode: "005783" },
      { name: "Josh",    barcode: "005443" },
      { name: "Luisa",   barcode: "007425" },
      { name: "Seth",    barcode: "005445" },
    ];

    const container = document.getElementById('passes');

    passes.forEach((p, i) => {
      const div = document.createElement('div');
      div.className = 'pass';
      div.innerHTML = `
        <div class="pass-name">${p.name}</div>
        <svg id="bc${i}"></svg>
        <div class="pass-number">${p.barcode}</div>
      `;
      container.appendChild(div);

      JsBarcode(`#bc${i}`, p.barcode, {
        format: "CODE128",
        width: 2.8,
        height: 70,
        displayValue: false,
        margin: 6,
        background: "#ffffff",
        lineColor: "#000000"
      });
    });

    // Keep screen awake
    if (navigator.wakeLock) {
      navigator.wakeLock.request('screen').catch(() => {});
    }
  </script>
</body>
</html>
